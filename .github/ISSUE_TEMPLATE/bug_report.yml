name: Bug report
description: A query, transaction or value that comes back wrong through this adapter
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A problem in the client underneath belongs in
        [panates/postgrejs](https://github.com/panates/postgrejs/issues). If the same query is
        wrong through `@prisma/adapter-pg` as well, it belongs in
        [prisma/prisma](https://github.com/prisma/prisma/issues). If you are not sure which side it
        is on, report it here and say so.

  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Smallest reproduction
      description: >
        The Prisma Client call, the model it runs against and the result. The matching part of
        schema.prisma helps. A runnable snippet is worth more than a description.
      render: ts
    validations:
      required: true

  - type: input
    id: version-adapter
    attributes:
      label: prisma-postgrejs version
    validations:
      required: true

  - type: input
    id: version-prisma
    attributes:
      label: prisma and @prisma/client version
      description: The peer range of @prisma/driver-adapter-utils is >=7.10.0 <9.
    validations:
      required: true

  - type: input
    id: version-postgrejs
    attributes:
      label: postgrejs version
      description: The peer range is >=3.12.1 <4.
    validations:
      required: true

  - type: input
    id: version-postgres
    attributes:
      label: PostgreSQL server version
    validations:
      required: true

  - type: input
    id: version-node
    attributes:
      label: Node.js version
    validations:
      required: true

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else
      description: >
        Pooling in front of the server (PgBouncer and its mode), adapter options you set, whether
        it also happens through @prisma/adapter-pg, or the PostgreSQL error code if there was one.

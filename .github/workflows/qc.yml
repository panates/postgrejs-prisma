name: Quality Check
on:
  # Can be run manually
  workflow_dispatch:

  # on pull request
  push:
    branches-ignore:
      - main
      - dev

# Only one run per branch at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The called workflow only checks out and runs quality checks, and a called
# workflow inherits the caller's permissions, so the token is pinned to read
# here rather than inherited from the repository default.
permissions:
  contents: read

jobs:
  qc:
    uses: panates/github-actions/.github/workflows/node-qc.yaml@v3
    with:
      # The default is `npm run qc`, and that script no longer exists: the rman migration moved
      # lint and the circular-dependency check out of package.json and into commands the preset
      # contributes. Left at the default this job failed on a missing script.
      #
      # These are the same three checks `test.yml` runs, minus the database - a feature branch gets
      # the cheap half on every push and the full matrix once it reaches dev.
      qc_script: 'rman lint && rman check && rman compile'
    # PERSONAL_ACCESS_TOKEN is not passed: the called workflow wants it only for
    # npm.pkg.github.com, and nothing here is hosted there.

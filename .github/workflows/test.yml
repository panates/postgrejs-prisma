name: Test
on:
  # `PERSONAL_ACCESS_TOKEN` is gone: no dependency here carries a private scope and there is no
  # .npmrc, so the token had nothing to authenticate.
  workflow_call:

  # Can be run manually
  workflow_dispatch:

  # on git push
  push:
    branches:
      - dev

# This workflow only ever reads the repository: it checks out, installs and
# runs tests. Set explicitly rather than left to the repository default,
# which is org-wide and can be widened later without anyone editing here.
permissions:
  contents: read

# Only one run per branch at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node v${{ matrix.node }}, prisma ${{ matrix.prisma }}, PostgreSQL v${{ matrix.postgres }}
    strategy:
      fail-fast: false
      matrix:
        node: [ '22', '24' ]
        postgres: [ '16', '18' ]
        # The adapter's peer range is >=7.10.0 <9. 7.10.0 is the floor because
        # it is the first release carrying the full MappedError vocabulary -
        # `RestrictViolation` and `InvalidInputValue` arrived there, and
        # `@prisma/driver-adapter-utils`'s .d.ts is byte-identical from 7.10.0
        # into the 8.x line. Add the 8.x release to this list when it ships.
        prisma: [ '7.10.0' ]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # `@v2`: `install: 'ci'` installs exactly what the lockfile pins, where `@v1` deleted
      # package-lock.json first and installed whatever resolved that morning - so what CI tested was
      # a dependency set nobody had pinned. `rman-version` replaces `@v1`'s unpinned global install.
      - name: Setup Environment
        uses: panates/gh-setup-node@v2
        with:
          node-version: ${{ matrix.node }}
          rman-version: '2'
          install: 'ci'

      - name: Install the Prisma version under test
        run: >-
          npm install --no-save
          prisma@${{ matrix.prisma }}
          @prisma/client@${{ matrix.prisma }}
          @prisma/adapter-pg@${{ matrix.prisma }}
          @prisma/driver-adapter-utils@${{ matrix.prisma }}

      # **The preset's own commands, not npm scripts.** `lint`, `check` and `compile` were root
      # scripts; they are commands `@panates/rman-preset` contributes now, so every repository
      # extending it spells them the same way and pins the flags in one place - dpdm's
      # `--exit-code circular:1` above all, without which it reports a cycle and still exits 0.
      # All three scripts these steps called had already been deleted from package.json, so this
      # job could not have passed: `npm run lint`, `check` and `compile` each exited 1, and
      # `citest` exited 127 on a `rimraf` that is no longer a dependency.
      - name: Run linter test
        run: rman lint

      - name: Run circular dependency test
        run: rman check

      - name: Run type check
        run: rman compile

      - name: Run unit tests
        run: npm run citest
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres

      - name: Send coverage to Coveralls
        uses: coverallsapp/github-action@v2
        # Run only once
        if: ${{ matrix.node == '22' && matrix.postgres == '18' && matrix.prisma == '7.10.0' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
